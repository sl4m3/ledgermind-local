[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgermind-local"
version = "4.0.0a1"
description = "LedgerMind local service bootstrap for v4 architecture"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.111,<1",
    "PyYAML>=6.0,<7",
    "ledgermind-core>=4.0.0a1,<4.1",
    "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.111,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6",
]

[project.scripts]
ledgermind = "ledgermind_local.cli:main"
ledgermind-v4 = "ledgermind_local.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ledgermind_local*"]

[tool.setuptools.package-data]
"ledgermind_local.persistence" = ["migrations/*.sql"]
"ledgermind_local.plugins.hermes" = ["plugin.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

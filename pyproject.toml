[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgermind-local"
version = "4.0.0a1"
description = "LedgerMind local service bootstrap for v4 architecture"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.111,<1",
    "PyYAML>=6.0,<7",
    "ledgermind-core>=4.0.0a1,<4.1",
    "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.111,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6",
]

[project.scripts]
ledgermind = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
py-modules = ["bootstrap", "cli", "config", "paths", "service_lock"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api", "diagnostics", "persistence", "projections", "scheduler", "search"]

[tool.setuptools.package-data]
persistence = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
